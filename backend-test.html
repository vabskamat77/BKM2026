<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kala Mel Backend Test</title><style>body{background:#F2ECDF;color:#F2ECDF;font:16px Arial;margin:20px}main{max-width:650px;margin:auto;background:#0E2A1F;padding:24px;border-radius:18px}h1{color:#F4C430}header{display:flex;align-items:center;gap:15px}img{width:80px;height:80px;object-fit:contain}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;border:0;font:inherit}button{background:#F4C430;color:#14221D;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#294438;padding:14px;border-radius:8px}</style><main><header><img src="assets/antruz-ghudyo.png" alt="Antruz Ghudyo"><img src="assets/bkm-logo.png" alt="BKM"></header><h1>11th Bhurgyancho Kala Mel</h1><h2>Backend diagnostic</h2><button id="health" disabled>1. Test backend connection</button><form id="login"><input id="email" type="email" required placeholder="Administrator email" autocomplete="username"><input id="password" type="password" required placeholder="Password" autocomplete="current-password"><button id="signin" disabled>2. Sign in</button></form><button id="init" disabled>3. Initialize event and 20 schools</button><button id="logout" disabled>Sign out</button><p id="session">Loading Firebase…</p><pre id="output" aria-live="polite">Waiting for Firebase.</pre></main><script type="module">
const $=id=>document.getElementById(id);const base='https://kalamel.vercel.app';const show=x=>$('output').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
try{const {auth}=await import('./js/firebase-config.js');const {signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js');
async function call(path,options){const r=await fetch(base+'/api/'+path,options);const data=await r.json();show({httpStatus:r.status,...data});}
async function run(id,fn){$(id).disabled=true;try{await fn();}catch(e){show(e.message);}finally{$(id).disabled=id==='init'&&!auth.currentUser;}}
$('health').disabled=false;$('signin').disabled=false;$('health').onclick=()=>run('health',()=>call('health'));
onAuthStateChanged(auth,u=>{$('session').textContent=u?'Signed in: '+u.email:'Signed out';$('init').disabled=!u;$('logout').disabled=!u;});
$('login').onsubmit=e=>{e.preventDefault();run('signin',async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);show('Signed in. Backend will verify administrator permissions on initialization.');}finally{$('password').value='';}});};
$('init').onclick=()=>{if(!confirm('Initialize the event? Existing event data will not be overwritten.'))return;run('init',async()=>{const token=await auth.currentUser.getIdToken();await call('initialize-event',{method:'POST',headers:{Authorization:'Bearer '+token}});});};$('logout').onclick=()=>signOut(auth).catch(e=>show(e.message));show('Firebase loaded. Test the backend connection.');
}catch(e){show('Firebase load failed: '+e.message);}
</script></html>
